<script>
let papersMasterMap = {}; 
let hallDistributionOverrides = []; 
let processedHallsData = [];       
let currentSelectedMode = 'cards';
let globalPaperOrder = []; 
let roomNamesMap = {};



document.getElementById("examYear").value = new Date().getFullYear();


function parseId(id) {
    const str = String(id).trim();
    const match = str.match(/^([a-zA-Z]*)(\d+)$/);
    return match ? { prefix: match[1], num: match[2], val: parseInt(match[2]) } : { prefix: '', num: str, val: NaN };
}

function clearAll() {
    document.getElementById('fileInput').value = "";
    document.getElementById('dynamicOutput').innerHTML = "";
    document.getElementById('printControlGroup').style.display = "none";
    papersMasterMap = {};
    hallDistributionOverrides = [];
    processedHallsData = [];
    globalPaperOrder = [];
    roomNamesMap = {}; // <-- ADD THIS LINE
}

async function triggerDataLoad() {
    papersMasterMap = {};
    hallDistributionOverrides = [];
    processedHallsData = [];
    globalPaperOrder = [];
    
    const rawParsedList = await loadData();
    if (!rawParsedList || rawParsedList.length === 0) return;
    
    rawParsedList.forEach(item => {
        if (!papersMasterMap[item.paper]) {
            papersMasterMap[item.paper] = [];
            globalPaperOrder.push(item.paper);
        }
        papersMasterMap[item.paper].push(item);
    });

    for (let paperName in papersMasterMap) {
        papersMasterMap[paperName].sort((a, b) => {
            let pa = parseId(a.id), pb = parseId(b.id);
            if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
            return (pa.val || 0) - (pb.val || 0);
        });
    }

    resetToGlobalDefault();
}

function resetToGlobalDefault() {
    if (globalPaperOrder.length === 0) return;
    
    const defaultHallSize = parseInt(document.getElementById('pageSize').value) || 30;
    hallDistributionOverrides = [];
    
    let workingPools = {};
    globalPaperOrder.forEach(p => {
        workingPools[p] = [...papersMasterMap[p]];
    });

    let loopSafety = 0;
    while (hasStudentsLeft(workingPools) && loopSafety < 500) {
        loopSafety++;
        let hallSpaceRemaining = defaultHallSize;
        let hallAllocationConfig = {};

        for (let p of globalPaperOrder) {
            if (workingPools[p].length > 0 && hallSpaceRemaining > 0) {
                let grabSize = Math.min(workingPools[p].length, hallSpaceRemaining);
                hallAllocationConfig[p] = grabSize;
                workingPools[p].splice(0, grabSize);
                hallSpaceRemaining -= grabSize;
            }
        }
        hallDistributionOverrides.push(hallAllocationConfig);
    }

    calculateHallsDistributionMatrix();
    renderOutput(currentSelectedMode);
}

function hasStudentsLeft(poolsObj) {
    for (let p in poolsObj) {
        if (poolsObj[p].length > 0) return true;
    }
    return false;
}

function calculateHallsDistributionMatrix() {
    if (globalPaperOrder.length === 0) {
        processedHallsData = [];
        return;
    }

    let workingPools = {};
    globalPaperOrder.forEach(p => {
        workingPools[p] = [...papersMasterMap[p]];
    });

    processedHallsData = [];
    let hIdx = 0;

    while (hasStudentsLeft(workingPools) || hIdx < hallDistributionOverrides.length) {
        if (!hallDistributionOverrides[hIdx]) {
            let defaultHallSize = parseInt(document.getElementById('pageSize').value) || 30;
            let fallbackConfig = {};
            for (let p of globalPaperOrder) {
                if (workingPools[p].length > 0 && defaultHallSize > 0) {
                    let grab = Math.min(workingPools[p].length, defaultHallSize);
                    fallbackConfig[p] = grab;
                    defaultHallSize -= grab;
                }
            }
            hallDistributionOverrides[hIdx] = fallbackConfig;
        }

        let currentConfig = hallDistributionOverrides[hIdx];
        let currentHallList = [];

        for (let p of globalPaperOrder) {
            let targetCount = currentConfig[p] || 0;
            if (targetCount > 0) {
                let actualGrab = Math.min(workingPools[p].length, targetCount);
                if (actualGrab > 0) {
                    let chunk = workingPools[p].splice(0, actualGrab);
                    currentHallList = currentHallList.concat(chunk);
                }
                currentConfig[p] = actualGrab;
            }
        }

        processedHallsData.push(currentHallList);
        hIdx++;
    }

    while (hallDistributionOverrides.length > 0) {
        let lastIdx = hallDistributionOverrides.length - 1;
        let rowSum = 0;
        for (let p in hallDistributionOverrides[lastIdx]) {
            rowSum += hallDistributionOverrides[lastIdx][p] || 0;
        }
        if (rowSum === 0 && hallDistributionOverrides.length > 1) {
            hallDistributionOverrides.pop();
            if (processedHallsData.length > hallDistributionOverrides.length) {
                processedHallsData.pop();
            }
        } else {
            break;
        }
    }
}

function adjustPaperInHall(hallIndex, paperName, delta) {
    let configRow = hallDistributionOverrides[hallIndex - 1];
    if (!configRow) return;

    let currentVal = configRow[paperName] || 0;
    let newVal = currentVal + delta;
    if (newVal < 0) newVal = 0;

    if (delta > 0) {
        // --- HANDLE INCREMENT (+) ---
        let totalAssignedUpstream = 0;
        for (let i = 0; i < hallIndex - 1; i++) {
            totalAssignedUpstream += (hallDistributionOverrides[i][paperName] || 0);
        }
        let totalAvailableInMaster = papersMasterMap[paperName].length;
        let leftInPool = totalAvailableInMaster - totalAssignedUpstream;
        if (newVal > leftInPool) {
            alert(`Cannot add more. Only ${leftInPool} total students exist for this paper.`);
            return;
        }
        configRow[paperName] = newVal;
    } else if (delta < 0) {
        // --- HANDLE DECREMENT (-) ---
        if (currentVal <= 0) return;
        
        // Reduce the selected count in the current hall
        configRow[paperName] = newVal;

        // Shift the displaced student count dynamically into the next hall over its default strength
        let nextHallIndex = hallIndex; // index + 1 in human terms is hallDistributionOverrides[nextHallIndex]
        if (nextHallIndex < hallDistributionOverrides.length) {
            let nextHall = hallDistributionOverrides[nextHallIndex];
            nextHall[paperName] = (nextHall[paperName] || 0) + 1;
        } else {
            // If there is no next hall, dynamically generate a fresh one to accommodate the remainder
            let newHall = {};
            globalPaperOrder.forEach(p => { newHall[p] = 0; });
            newHall[paperName] = 1;
            hallDistributionOverrides.push(newHall);
        }
    }

    // Force recalculation and refresh the display framework
    calculateHallsDistributionMatrix();
    renderOutput('cards');
}

async function loadData() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files.length) { alert("Please select Excel files."); return null; }
    
    let list = [];
    for (const file of Array.from(fileInput.files)) {
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const paperName = sheet['B5'] ? String(sheet['B5'].v).trim() : "Unknown Paper";
        const excelDateTime = sheet['B6'] ? String(sheet['B6'].v).trim() : "";
        const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
        
        for(let r = 8; r < rows.length; r++) { 
            const regNumber = rows[r][1];
            const studentName = rows[r][2];
const studentDOB = rows[r][3];
            if(regNumber) {
                list.push({
    id: regNumber,
    name: studentName || "",
    dob: studentDOB || "",
    paper: paperName,
    dateTime: excelDateTime
});
            }
        }
    }
    return list;
}

function process(mode) {
    currentSelectedMode = mode;
    calculateHallsDistributionMatrix();

    const orientationSelector = document.getElementById('pdfOrientation');
    if (mode === 'master') {
        orientationSelector.value = 'landscape';
    } else {
        orientationSelector.value = 'portrait';
    }

    renderOutput(mode);
}


function renderOutput(mode = 'cards') {
    const output = document.getElementById('dynamicOutput');
    output.innerHTML = '';

    if (processedHallsData.length === 0) return;

    if (mode === 'cards') {
        processedHallsData.forEach((chunk, index) => {
            if (chunk.length >= 0) {
                renderHallCard(chunk, index + 1, chunk[0]?.dateTime || 'No Date');
            }
        });

    } else if (mode === 'summary') {
        renderSummaryTable();

    } else if (mode === 'master') {
        renderMasterTable();

    } else if (mode === 'stickers') {
        let flatCollectedList = [];
        processedHallsData.forEach(c => {
            flatCollectedList = flatCollectedList.concat(c);
        });
        renderStickers(flatCollectedList);

    } else if (mode === 'attendance') {
        renderAttendanceSheets();
    }

    document.getElementById('printControlGroup').style.display = 'flex';
}


function renderHallCard(chunk, num, date) {
    const examName = document.getElementById('examName').value;
    const output = document.getElementById('dynamicOutput');
    let bodyHtml = "";
    let groups = [];

    let sortedChunk = [...chunk].sort((a, b) => {
        let idxA = globalPaperOrder.indexOf(a.paper);
        let idxB = globalPaperOrder.indexOf(b.paper);
        if(idxA !== idxB) return idxA - idxB;
        
        let pa = parseId(a.id), pb = parseId(b.id);
        if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
        return (pa.val || 0) - (pb.val || 0);
    });

    sortedChunk.forEach(item => {
        let lastG = groups[groups.length - 1];
        let obj = parseId(item.id);
        if (lastG && lastG.paper === item.paper && obj.prefix === lastG.lastObj.prefix && obj.val === lastG.lastObj.val + 1) {
            lastG.ranges[lastG.ranges.length - 1].end = obj;
            lastG.lastObj = obj;
